<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>urbanPulse — Smart City Analytics</title>
  <meta name="description" content="urbanPulse — a smart city analytics dashboard prototype: air quality, mobility, energy, sensors and reported incidents." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12h4l2.2-5 3.6 10 2.6-6.5L16 12h6"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="brand-name">urbanPulse</span>
      <span class="brand-tag">Smart City Analytics</span>
    </div>
    <div class="header-controls">
      <span class="as-of">Updated <time id="updated">today</time></span>
      <button id="theme-toggle" class="icon-btn" type="button"
              aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="4.2" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="dashboard">
    <!-- Filters: one row, above everything they scope -->
    <nav class="filter-row" aria-label="Dashboard filters">
      <span class="filter-label">Range</span>
      <div class="segmented" role="radiogroup" id="range-group" aria-label="Date range">
        <button type="button" role="radio" data-range="7"  aria-checked="false">7 days</button>
        <button type="button" role="radio" data-range="30" aria-checked="true">30 days</button>
        <button type="button" role="radio" data-range="90" aria-checked="false">90 days</button>
      </div>
      <span class="filter-hint" id="range-hint">Last 30 days</span>
    </nav>

    <!-- KPI row: hero + stat tiles -->
    <section class="kpi-row" aria-label="Key metrics">
      <figure class="card hero-card">
        <figcaption class="card-title">City health index</figcaption>
        <p class="hero-caption">Composite of air, mobility, energy resilience and water.</p>
        <div class="hero-value" id="hero-value">—</div>
        <div class="hero-delta" id="hero-delta"></div>
        <div class="hero-breakdown" id="hero-breakdown"></div>
      </figure>

      <figure class="card tile">
        <figcaption class="tile-label">Air quality index</figcaption>
        <div class="tile-value" id="aqi-value">—</div>
        <div class="tile-delta" id="aqi-delta"></div>
        <div class="tile-spark" id="aqi-spark"></div>
      </figure>

      <figure class="card tile">
        <figcaption class="tile-label">Active sensors</figcaption>
        <div class="tile-value" id="sensor-value">—</div>
        <div class="tile-delta" id="sensor-delta"></div>
        <div class="tile-spark" id="sensor-spark"></div>
      </figure>

      <figure class="card tile">
        <figcaption class="tile-label">Traffic congestion</figcaption>
        <div class="tile-value" id="traffic-value">—</div>
        <div class="tile-delta" id="traffic-delta"></div>
        <div class="tile-spark" id="traffic-spark"></div>
      </figure>

      <figure class="card tile">
        <figcaption class="tile-label">Energy demand</figcaption>
        <div class="tile-value" id="energy-value">—</div>
        <div class="tile-delta" id="energy-delta"></div>
        <div class="tile-spark" id="energy-spark"></div>
      </figure>
    </section>

    <!-- Charts -->
    <section class="charts" aria-label="City analytics">

      <figure class="card chart chart--wide" data-chart="air">
        <header class="chart-head">
          <div>
            <figcaption class="card-title">Air quality trend</figcaption>
            <p class="card-subtitle">Daily pollutant concentrations, selected range.</p>
          </div>
          <div class="legend" id="aq-legend"></div>
          <button type="button" class="table-toggle">Table</button>
        </header>
        <div class="chart-body line-body" id="aq-chart" tabindex="0"
             aria-label="Air quality line chart. Use arrow keys to explore."></div>
        <table class="data-table" id="aq-table" hidden></table>
      </figure>

      <figure class="card chart" data-chart="traffic">
        <header class="chart-head">
          <div>
            <figcaption class="card-title">Traffic congestion by zone</figcaption>
            <p class="card-subtitle">Average index by time of day, selected range.</p>
          </div>
          <div class="legend" id="traffic-legend"></div>
          <button type="button" class="table-toggle">Table</button>
        </header>
        <div class="chart-body" id="traffic-chart" tabindex="0"
             aria-label="Traffic congestion grouped bar chart."></div>
        <table class="data-table" id="traffic-table" hidden></table>
      </figure>

      <figure class="card chart" data-chart="energy">
        <header class="chart-head">
          <div>
            <figcaption class="card-title">Energy mix</figcaption>
            <p class="card-subtitle">Demand composition, summed per period.</p>
          </div>
          <div class="legend" id="energy-legend"></div>
          <button type="button" class="table-toggle">Table</button>
        </header>
        <div class="chart-body" id="energy-chart" tabindex="0"
             aria-label="Stacked energy mix bar chart."></div>
        <table class="data-table" id="energy-table" hidden></table>
      </figure>

      <figure class="card chart" data-chart="sensors">
        <header class="chart-head">
          <div>
            <figcaption class="card-title">Sensor uptime</figcaption>
            <p class="card-subtitle">Reporting availability by zone and 4-hour block.</p>
          </div>
          <button type="button" class="table-toggle">Table</button>
        </header>
        <div class="chart-body" id="sensor-chart" tabindex="0"
             aria-label="Sensor uptime heatmap. Use arrow keys to explore."></div>
        <div class="scale-legend" id="sensor-scale" aria-hidden="false">
          <span class="scale-min" id="sensor-scale-min">90</span>
          <span class="scale-bar" id="sensor-scale-bar"></span>
          <span class="scale-max" id="sensor-scale-max">100</span>
          <span class="scale-text">% reporting</span>
        </div>
        <table class="data-table" id="sensor-table" hidden></table>
       </figure>

      <figure class="card chart" data-chart="incidents">
        <header class="chart-head">
          <div>
            <figcaption class="card-title">Reported incidents</figcaption>
            <p class="card-subtitle">Citizen reports by category, selected range.</p>
          </div>
          <button type="button" class="table-toggle">Table</button>
        </header>
        <div class="chart-body" id="incident-chart" tabindex="0"
             aria-label="Reported incidents bar chart."></div>
        <table class="data-table" id="incident-table" hidden></table>
      </figure>

    </section>

    <footer class="app-footer">
      <p>urbanPulse prototype · synthetic data for demo purposes · renders locally in your browser.</p>
    </footer>
  </main>

  <div id="tooltip" class="tip" hidden role="status"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
